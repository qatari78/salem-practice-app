<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Salem AI practice app</title>
<style>
  body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #f4f5f8; color: #1c2541; }
  main { text-align: center; }
  #count { font-size: 4rem; font-weight: 700; margin: .5rem 0 1rem; }
  button { font-size: 1.25rem; padding: .75rem 2rem; border: 0; border-radius: .5rem; background: #1c2541; color: #fff; }
  small { display: block; margin-top: 1.5rem; color: #777; }
  #total { margin: 0 0 1rem; }
</style>
</head>
<body>
<main>
  <h1>Practice app</h1>
  <div id="count" data-testid="count">0</div>
  <small id="total" data-testid="total">Total taps: 0</small>
  <button id="add" data-testid="add">Add one</button>
  <button id="reset" data-testid="reset">Reset</button>
  <small>Environment: {{ENV}}</small>
</main>
<script>
  let n = 0;
  let total = 0;
  const totalElement = document.getElementById('total');
  document.getElementById('add').addEventListener('click', () => {
    document.getElementById('count').textContent = String(++n);
    total++;
    if (totalElement) totalElement.textContent = `Total taps: ${total}`;
  });
  document.getElementById('reset').addEventListener('click', () => {
    n = 0;
    document.getElementById('count').textContent = String(n);
  });
</script>
</body>
</html>
